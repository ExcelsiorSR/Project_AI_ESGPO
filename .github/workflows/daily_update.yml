name: Daily Portfolio Update

on:
  schedule:
    # Running at 3:29 UTC daily (which is 8:59 AM IST)
    - cron: '29 3 * * *'
  workflow_dispatch: # Allowing manual runs for testing

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # --- Installing TA-Lib (Required for main.py) ---
      - name: Install TA-Lib C Library
        run: |
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
      
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Run the Heavy Optimization (Generates Portfolios)
      - name: Run Optimization Script
        run: python main.py

      # 2. FAIL-SAFE: Run Force Update & Overwrite
      # This ensures the backtester data is 100% fresh, ignoring main.py's data file
      - name: Force Refresh Price Data
        run: |
          python force_update.py
          # Overwrite the standard file with the fresh v2 data
          mv backtest_price_data_v2.csv backtest_price_data.csv

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add *.csv
          # The commit will fail if there are no changes, so we allow it to exit gracefully
          git commit -m "📈 Auto-update: Daily portfolio data" || echo "No changes to commit"
          git push
